# A port's build on GitHub, in the riscos-crossdev container image.
# Copy to .github/workflows/riscos-build.yml in your repository. The image
# is the one for the riscos-crossdev release named in .riscos-deps at the
# top of the repository (a line `riscos-crossdev v1.8`; see
# riscos-deps-update.yml). Change BUILD to your build and test command, and
# ARTIFACTS to what it makes. PACKAGES: Ubuntu packages your build needs
# that the image hasn't (docker/Dockerfile lists what it has); set the same
# in riscos-deps-update.yml.
#
# From riscos-crossdev v1.8.2's ci/ (docs/CI.md). MIT licence.
name: RISC OS build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD: make check all          # the crossdev checks, every Linux test (fixtures from NewPipe), the zip
  ARTIFACTS: out/*.zip           # TubeSearch-<version>.zip
  PACKAGES: ""                   # e.g. "python3-pil shared-mime-info"

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: pin
        run: |
          v=$(awk '$1 == "riscos-crossdev" || $1 == "adyoull/riscos-crossdev" {sub(/^v/, "", $2); print $2}' .riscos-deps)
          [ -n "$v" ] || { echo ".riscos-deps has no riscos-crossdev line" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: pin
    runs-on: ubuntu-24.04
    container: ghcr.io/adyoull/riscos-crossdev:${{ needs.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Packages this port needs
        if: env.PACKAGES != ''
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends $PACKAGES
      - name: Build, check and test
        run: ${{ env.BUILD }}
      - uses: actions/upload-artifact@v7
        with:
          name: riscos-build
          path: ${{ env.ARTIFACTS }}
          if-no-files-found: warn
